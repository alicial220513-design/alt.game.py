        }

            color: #4da6ff;
        }

            position: relative;

            width: min(900px, 95vw);
            aspect-ratio: 3 / 2;

            border: 3px solid #4da6ff;
            border-radius: 12px;

            overflow: hidden;

            box-shadow: 0 0 30px rgba(77, 166, 255, 0.2);
        }

            height: 100%;

            display: block;

            background: #232833;
        }

            color: #bbb;
            text-align: center;
        }

            font-weight: bold;
